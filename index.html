<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#12120f">
  <title>Spliceworld</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c8f000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M6 3 C6 8 18 8 18 13 C18 18 6 18 6 21'/><path d='M18 3 C18 8 6 8 6 13 C6 18 18 18 18 21'/><path d='M7.3 6.4 L16.7 6.4'/><path d='M6.5 11.3 L17.5 11.3'/><path d='M6.5 12.7 L17.5 12.7'/><path d='M7.3 17.6 L16.7 17.6'/></svg>">
</head>
<body>
  <header>
    <h1>SPLICE<span>WORLD</span></h1>
    <p class="tagline">Ethically ambiguous genetics. Family-friendly results.™</p>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-screen="ranch">Ranch</button>
    <button type="button" data-screen="pens">Pens</button>
    <button type="button" data-screen="vault">Vault</button>
    <button type="button" data-screen="theater">Splice</button>
    <button type="button" data-screen="battle">War</button>
    <button type="button" data-screen="dex">Dex</button>
  </nav>

  <main>
    <div id="screen-ranch" class="screen" hidden></div>
    <div id="screen-pens" class="screen" hidden></div>
    <div id="screen-vault" class="screen" hidden></div>
    <div id="screen-theater" class="screen" hidden></div>
    <div id="screen-battle" class="screen" hidden></div>
    <div id="screen-dex" class="screen" hidden></div>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <div id="picker" class="picker-host" hidden></div>

  <footer>
    <p id="ticker" class="ticker"></p>
    <button type="button" id="settings" class="icon-btn" aria-label="Settings — sound, theme, save, labs"></button>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
