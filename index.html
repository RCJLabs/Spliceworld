<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Spliceworld — Splice Slab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧬</text></svg>">
</head>
<body>
  <header>
    <h1>SPLICE<span>WORLD</span></h1>
    <p class="tagline">Ethically ambiguous genetics. Family-friendly results.™</p>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-screen="ranch">Ranch</button>
    <button type="button" data-screen="pens">Pens</button>
    <button type="button" data-screen="vault">Vault</button>
    <button type="button" data-screen="theater">Theater</button>
    <button type="button" data-screen="battle">Battle</button>
  </nav>

  <main>
    <div id="screen-ranch" class="screen" hidden></div>
    <div id="screen-pens" class="screen" hidden></div>
    <div id="screen-vault" class="screen" hidden></div>
    <div id="screen-theater" class="screen" hidden></div>
    <div id="screen-battle" class="screen" hidden></div>
  </main>

  <div id="overlay" class="overlay" hidden></div>

  <footer>
    <p id="ticker" class="ticker"></p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
